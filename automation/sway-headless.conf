# Minimal Sway config for the private automation compositor.
# No bar, no real input devices (headless/nested backend handles that),
# no keybindings needed since all input arrives via ydotool/uinput.
output * bg #1d1f21 solid_color

# The game runs via Proton/Wine which targets X11 (XWayland), not native
# Wayland, on this system - force our own private XWayland up immediately
# rather than relying on lazy auto-start.
xwayland enable
